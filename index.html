<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <title>Tic Tac Toe</title>
    <link href="style.css" rel="stylesheet"/>
    <script src="script.js" async></script>
    <script src="test-script.js" async></script>
</head>
<body>

<section class="gameContainer">
    <div class="gameInfoAndControl">
        <div class="gameInitiationContainer">
            <div class="gameName">Tic-Tac-Toe</div> 
            <button class="startGameButton button">Start Game</button> 
        </div> 
        <div class="gameControlAndInfo"> 
            <div class="firstPlayer"></div>
            <div  class="secondPlayer"></div>
            <div  class="roundNumber"></div>
            <div  class="roundInfo"></div>
            <button class="resetGame button">Reset Game</button>
            <button class="changeNameButton button">Change Name</button>  
        </div>
    </div>
    <div class="boardgameDisplay"> 
    </div>
</section>
 
</body>
</html>
