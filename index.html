<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <title>Tic Tac Toe</title>
    <link href="style.css" rel="stylesheet"/>
    <script src="script.js" async></script>
    <script src="test-script.js" async></script>
</head>
<body>

<section class="gameContainer">
    <div class="gameInfoAndControl">
        <div>TIC-TAC-TOE</div>
        <button class="startGameButton">Start</button>

        <div hidden class="firstPlayer"></div>
        <div hidden class="secondPlayer"></div>
        <div hidden class="roundNumber"></div>
        <div hidden class="roundInfo"></div>
        <button hidden class="resetGame">Reset</button>
        <button hidden class="changeNameButton">Change Name</button>  
    </div>
    <div class="boardgameDisplay">
    </div>
</section>

</body>
</html>
